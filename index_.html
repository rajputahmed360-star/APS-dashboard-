<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APS Fleet CRM — Arabian Private Services</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0E6C39">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="APS Fleet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#0A0F0C;
  --panel:#101915;
  --panel-2:#152420;
  --border:#1E332A10;
  --border-c:#1E3A2E;
  --text:#EAF2ED;
  --text-dim:#8FA89B;
  --text-mute:#5C7568;
  --accent:#3D6FE0;
  --accent-dim:#1F4391;
  --amber:#E8A33D;
  --green:#1FAE5E;
  --green-dim:#0E6C39;
  --red:#E1554F;
  --grey-brand:#8B9490;
  --radius:12px;
  --mono: 'Consolas','SFMono-Regular','Courier New',monospace;
  --disp: 'Segoe UI Semibold','Segoe UI',Arial,sans-serif;
  --body: 'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 15% 0%, #0F2418 0%, transparent 45%),
    radial-gradient(circle at 100% 100%, #0C1A2C 0%, transparent 50%),
    var(--ink);
  color:var(--text);
  font-family:var(--body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#233445;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

#shell{display:flex;min-height:100vh;}

/* SIDEBAR */
#sidebar{
  width:238px;flex:none;
  background:linear-gradient(180deg,#0D1712 0%,#0A1119 55%,#0A1119 100%);
  border-right:1px solid var(--border-c);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{
  padding:20px 18px 16px;
  border-bottom:1px solid var(--border-c);
}
.brand-plate{
  background:#F6F8F6;border-radius:10px;padding:10px 12px 8px;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}
.brand-plate img{display:block;width:100%;height:auto;}
.brand-sub{font-size:10px;color:var(--text-mute);letter-spacing:2px;text-transform:uppercase;margin-top:10px;text-align:center;}

nav{padding:14px 12px;flex:1;}
.nav-label{font-size:10px;color:var(--text-mute);letter-spacing:1.8px;text-transform:uppercase;margin:14px 10px 8px;}
.nav-btn{
  width:100%;display:flex;align-items:center;gap:11px;
  padding:10px 12px;border:none;background:transparent;color:var(--text-dim);
  border-radius:9px;cursor:pointer;font-size:13.5px;font-family:var(--body);
  text-align:left;margin-bottom:2px;transition:.15s;font-weight:500;
}
.nav-btn:hover{background:#132030;color:var(--text);}
.nav-btn.active{
  background:linear-gradient(90deg,#173247,#142433);
  color:var(--text);
  box-shadow:inset 3px 0 0 var(--accent);
}
.nav-btn .ic{width:17px;text-align:center;font-size:14.5px;opacity:.9;}
.sidebar-foot{padding:14px 20px;border-top:1px solid var(--border-c);font-size:10.5px;color:var(--text-mute);letter-spacing:.5px;}

/* MAIN */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  padding:20px 32px;border-bottom:1px solid var(--border-c);
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,#0D1721,transparent);
}
#topbar h1{font-family:var(--disp);font-size:21px;letter-spacing:.3px;}
#topbar .sub{color:var(--text-mute);font-size:12.5px;margin-top:4px;}
#content{padding:28px 32px 60px;max-width:1400px;}

.btn{
  border:none;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;
  cursor:pointer;font-family:var(--body);display:inline-flex;align-items:center;gap:7px;transition:.15s;
}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#04141D;}
.btn-accent:hover{filter:brightness(1.1);}
.btn-ghost{background:#152534;color:var(--text);border:1px solid var(--border-c);}
.btn-ghost:hover{background:#1B2E40;}
.btn-danger{background:#2A1416;color:#F0A5A2;border:1px solid #4A2426;}
.btn-sm{padding:6px 11px;font-size:11.5px;border-radius:6px;}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px;}
.kpi{
  background:linear-gradient(160deg,var(--panel-2),var(--panel));
  border:1px solid var(--border-c);border-radius:var(--radius);
  padding:17px 18px;position:relative;overflow:hidden;
}
.kpi::after{content:'';position:absolute;top:-30px;right:-30px;width:80px;height:80px;border-radius:50%;
  background:radial-gradient(circle,var(--kc,var(--accent)) 0%,transparent 70%);opacity:.15;}
.kpi .lbl{font-size:11px;color:var(--text-mute);text-transform:uppercase;letter-spacing:1.2px;font-weight:600;}
.kpi .val{font-family:var(--mono);font-size:28px;margin-top:8px;font-weight:700;}
.kpi .delta{font-size:11px;margin-top:6px;color:var(--text-dim);}

.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-bottom:22px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media(max-width:1050px){.grid2{grid-template-columns:1fr;}.grid3{grid-template-columns:1fr;}}

.card{
  background:var(--panel);border:1px solid var(--border-c);border-radius:var(--radius);
  padding:20px 22px;
}
.card h3{font-family:var(--disp);font-size:14.5px;letter-spacing:.4px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.card h3 .tag{font-size:10.5px;background:#152534;color:var(--text-dim);padding:3px 9px;border-radius:20px;font-weight:500;letter-spacing:.5px;}

/* GAUGE */
.gauge-wrap{display:flex;align-items:center;gap:22px;}
.gauge-num{font-family:var(--mono);font-size:34px;font-weight:700;}
.gauge-cap{color:var(--text-mute);font-size:11.5px;text-transform:uppercase;letter-spacing:1px;margin-top:4px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;color:var(--text-mute);font-weight:600;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.8px;padding:9px 10px;border-bottom:1px solid var(--border-c);
}
td{padding:11px 10px;border-bottom:1px solid #17232F;color:var(--text-dim);}
tr:last-child td{border-bottom:none;}
td.strong{color:var(--text);font-weight:600;}
.mono{font-family:var(--mono);}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px;}
.badge-green{background:#12321F;color:var(--green);}
.badge-amber{background:#332711;color:var(--amber);}
.badge-red{background:#331414;color:var(--red);}
.badge-blue{background:#122C38;color:var(--accent);}
.badge-grey{background:#1A2733;color:var(--text-dim);}

/* FLEET GRID */
.fleet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px;}
.car-card{
  background:linear-gradient(160deg,var(--panel-2),var(--panel));border:1px solid var(--border-c);
  border-radius:var(--radius);padding:17px 18px;cursor:pointer;transition:.15s;position:relative;
}
.car-card:hover{border-color:var(--accent-dim);transform:translateY(-2px);}
.car-top{display:flex;justify-content:space-between;align-items:flex-start;}
.car-name{font-family:var(--disp);font-size:15px;}
.car-plate{font-family:var(--mono);font-size:11.5px;color:var(--text-mute);margin-top:3px;letter-spacing:1px;}
.car-stats{display:flex;justify-content:space-between;margin-top:16px;padding-top:13px;border-top:1px solid var(--border-c);}
.car-stats div{font-size:10.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.5px;}
.car-stats .v{font-family:var(--mono);font-size:15px;color:var(--text);margin-top:3px;}

/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.form-grid.c3{grid-template-columns:1fr 1fr 1fr;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px;}
.field label{font-size:11.5px;color:var(--text-dim);font-weight:600;letter-spacing:.3px;}
.field input,.field select,.field textarea{
  background:#0C161F;border:1px solid var(--border-c);border-radius:7px;color:var(--text);
  padding:9px 11px;font-size:13px;font-family:var(--body);outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent-dim);}
.field textarea{resize:vertical;min-height:60px;}
.field .hint{font-size:10.5px;color:var(--text-mute);}
.check-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);}

.tabs-mini{display:flex;gap:6px;margin-bottom:16px;}
.tab-chip{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;background:#132030;color:var(--text-mute);cursor:pointer;border:1px solid transparent;}
.tab-chip.active{background:#173247;color:var(--accent);border-color:var(--accent-dim);}

/* MODAL */
#modal-layer{position:fixed;inset:0;background:rgba(4,9,14,.65);backdrop-filter:blur(2px);
  display:none;align-items:flex-start;justify-content:center;z-index:200;padding:40px 20px;overflow-y:auto;}
#modal-layer.open{display:flex;}
.modal-box{
  background:var(--panel);border:1px solid var(--border-c);border-radius:14px;
  width:100%;max-width:640px;padding:26px 28px 28px;position:relative;
}
.modal-box.wide{max-width:820px;}
.modal-close{position:absolute;top:16px;right:18px;background:none;border:none;color:var(--text-mute);font-size:20px;cursor:pointer;}
.modal-box h2{font-family:var(--disp);font-size:17px;margin-bottom:18px;}

.photo-drop{
  width:88px;height:88px;border-radius:10px;border:1px dashed var(--border-c);
  display:flex;align-items:center;justify-content:center;background:#0C161F;color:var(--text-mute);
  font-size:11px;text-align:center;cursor:pointer;overflow:hidden;flex:none;
}
.photo-drop img{width:100%;height:100%;object-fit:cover;}

.empty-state{padding:40px 20px;text-align:center;color:var(--text-mute);font-size:13px;}
.empty-state .big{font-size:26px;margin-bottom:8px;}

.calc-result{background:#0C161F;border:1px solid var(--border-c);border-radius:10px;padding:18px 20px;}
.calc-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13.5px;color:var(--text-dim);border-bottom:1px dashed #1D2C3A;}
.calc-row:last-child{border-bottom:none;}
.calc-row.total{border-top:1px solid var(--border-c);margin-top:6px;padding-top:14px;font-size:17px;color:var(--text);font-weight:700;font-family:var(--mono);}

.toast{position:fixed;bottom:24px;right:24px;background:#152534;border:1px solid var(--accent-dim);color:var(--text);
  padding:12px 18px;border-radius:9px;font-size:13px;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.4);
  opacity:0;transform:translateY(10px);transition:.25s;}
.toast.show{opacity:1;transform:translateY(0);}

.section-divider{font-size:11px;color:var(--text-mute);text-transform:uppercase;letter-spacing:1.4px;font-weight:700;
  margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border-c);}

.hairline{height:1px;background:var(--border-c);margin:18px 0;}
</style>
</head>

<div id="shell">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-plate"><img id="brand-logo" alt="APS - Arabian Private Services"></div>
      <div class="brand-sub">Fleet &amp; Rental Command Center</div>
    </div>
    <nav id="nav">
      <div class="nav-label">Overview</div>
      <button class="nav-btn" data-tab="dashboard"><span class="ic">&#9673;</span>Dashboard</button>
      <div class="nav-label">Operations</div>
      <button class="nav-btn" data-tab="fleet"><span class="ic">&#9635;</span>Fleet &amp; P&amp;L</button>
      <button class="nav-btn" data-tab="clients"><span class="ic">&#9679;</span>Clients</button>
      <button class="nav-btn" data-tab="rentals"><span class="ic">&#8644;</span>Rentals</button>
      <div class="nav-label">Partners</div>
      <button class="nav-btn" data-tab="investors"><span class="ic">&#9733;</span>Investors</button>
      <div class="nav-label">Tools</div>
      <button class="nav-btn" data-tab="calculator"><span class="ic">&#402;</span>Rent Calculator</button>
      <button class="nav-btn" data-tab="agreement"><span class="ic">&#9998;</span>Rental Agreement</button>
    </nav>
    <div class="sidebar-foot">
      <div id="storage-mode-line">APS FLEET CRM</div>
      <div style="display:flex;gap:10px;margin-top:8px">
        <a href="#" onclick="exportBackup();return false;" style="color:var(--accent)">Export Backup</a>
        <a href="#" onclick="document.getElementById('import-file').click();return false;" style="color:var(--accent)">Import</a>
      </div>
      <input type="file" id="import-file" accept="application/json" style="display:none" onchange="importBackup(this)">
    </div>
  </aside>

  <div id="main">
    <div id="topbar">
      <div>
        <h1 id="page-title">Dashboard</h1>
        <div class="sub" id="page-sub">Fleet performance at a glance</div>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        <div id="topbar-actions"></div>
        <div style="text-align:right;border-left:1px solid var(--border-c);padding-left:16px">
          <div style="font-family:var(--disp);font-size:12.5px;letter-spacing:.5px">APS <span style="color:var(--green)">Arabian</span> <span style="color:var(--grey-brand)">Private</span> <span style="color:var(--accent)">Services</span></div>
          <div style="font-size:10px;color:var(--text-mute);font-style:italic;margin-top:2px">Let us Drive you..</div>
        </div>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div id="modal-layer"><div class="modal-box" id="modal-box"></div></div>
<div class="toast" id="toast"></div>

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'aps-fleet-backup-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Backup downloaded');
}
function importBackup(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      const incoming = parsed.data || parsed;
      if(!confirm('This will replace all current data (cars, clients, rentals, transactions, investors) with the backup file. Continue?')) return;
      KEYS.forEach(k=>{ DB[k] = Array.isArray(incoming[k]) ? incoming[k] : []; });
      await Promise.all(KEYS.map(saveKey));
      toast('Backup restored');
      switchTab(currentTab);
    }catch(err){ toast('Invalid backup file', true); }
    input.value = '';
  };
  reader.readAsText(file);
}

async function saveKey(key){
  const raw = JSON.stringify(DB[key]);

  if(USE_SUPABASE){
    try{
      const table = key;
      const currentIds = DB[key].map(item=>item.id);
      const { data: existingRows, error: selErr } = await sb.from(table).select('id');
      if(selErr) throw selErr;
      const existingIds = (existingRows||[]).map(r=>r.id);
      const toDelete = existingIds.filter(id=>!currentIds.includes(id));
      if(toDelete.length){
        const { error: delErr } = await sb.from(table).delete().in('id', toDelete);
        if(delErr) throw delErr;
      }
      if(DB[key].length){
        const rows = DB[key].map(item=>({id:item.id, data:item, updated_at:new Date().toISOString()}));
        const { error: upErr } = await sb.from(table).upsert(rows);
        if(upErr) throw upErr;
      }
      return;
    }catch(e){
      const msg = (e && (e.message || e.details || e.hint)) || JSON.stringify(e);
      console.error('Supabase save failed for table "'+key+'": '+msg, e);
      toast('Cloud save failed ('+key+'): '+msg, true);
      return;
    }
  }

  if(HAS_ARTIFACT_STORAGE){
    try{ await window.storage.set(key, raw, false); return; }
    catch(e){ console.warn('artifact storage failed, falling back to localStorage', key, e); }
  }
  try{ localStorage.setItem(STORE_PREFIX+key, raw); }
  catch(e){ console.error('save failed', key, e); toast('Save failed — browser storage error', true); }
}
async function loadAll(){
  if(USE_SUPABASE){
    try{
      for(const k of KEYS){
        const { data, error } = await sb.from(k).select('data');
        if(error) throw error;
        DB[k] = (data||[]).map(r=>r.data);
      }
      if(DB.cars.length===0 && DB.clients.length===0 && DB.rentals.length===0){
        seedDemo();
        await Promise.all(KEYS.map(saveKey));
      }
      return;
    }catch(e){
      const msg = (e && (e.message || e.details || e.hint)) || JSON.stringify(e);
      console.error('Supabase load failed: '+msg, e);
      toast('Could not reach Supabase: '+msg, true);
    }
  }

  for(const k of KEYS){
    let loaded = null;
    if(HAS_ARTIFACT_STORAGE){
      try{
        const r = await window.storage.get(k, false);
        loaded = r && r.value ? r.value : null;
      }catch(e){ /* key may not exist yet, or storage unavailable */ }
    }
    if(loaded===null){
      try{ loaded = localStorage.getItem(STORE_PREFIX+k); }catch(e){ loaded = null; }
    }
    DB[k] = loaded ? JSON.parse(loaded) : [];
  }
  if(DB.cars.length===0 && DB.clients.length===0 && DB.rentals.length===0){
    seedDemo();
    await Promise.all(KEYS.map(saveKey));
  }
}

function openRentalForm(){
  const availableCars = DB.cars.filter(c=>c.status!=='maintenance' && !DB.rentals.some(r=>r.carId===c.id && r.status==='active'));
  if(!DB.clients.length || !DB.cars.length){ toast('Add at least one client and one vehicle first', true); return; }
  openModal(`
    <h2>New Rental</h2>
    <div class="form-grid">
      <div class="field"><label>Client</label><select id="r-client">${DB.clients.map(c=>`<option value="${c.id}">${esc(c.name)} ${c.type==='dealer'?'(Dealer)':''}</option>`).join('')}</select></div>
      <div class="field"><label>Vehicle</label><select id="r-car" onchange="rentalCarChanged()">
        ${(availableCars.length?availableCars:DB.cars).map(c=>`<option value="${c.id}" data-rate="${c.dailyRate}">${esc(c.make)} ${esc(c.model)} — ${esc(c.plate)}</option>`).join('')}
      </select></div>
      <div class="field"><label>Start Date</label><input id="r-start" type="date" value="${todayISO()}" onchange="recalcRental()"></div>
      <div class="field"><label>End Date</label><input id="r-end" type="date" value="${todayISO()}" onchange="recalcRental()"></div>
      <div class="field"><label>Route</label><select id="r-city" onchange="recalcRental()"><option value="city">City</option><option value="out_of_city">Out of City</option></select></div>
      <div class="field"><label>Daily Rate (Rs)</label><input id="r-rate" type="number" oninput="recalcRental()"></div>
      <div class="field"><label>Security Deposit (Rs)</label><input id="r-deposit" type="number" value="0"></div>
      <div class="field"><label>Total Amount (Rs)</label><input id="r-total" type="number"></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-accent" onclick="saveRental()">Create Rental</button>
    </div>
  `);
  rentalCarChanged();
}
function rentalCarChanged(){
  const sel = document.getElementById('r-car');
  const rate = sel.options[sel.selectedIndex].dataset.rate;
  document.getElementById('r-rate').value = rate;
  recalcRental();
}
function recalcRental(){
  const start = new Date(document.getElementById('r-start').value);
  const end = new Date(document.getElementById('r-end').value);
  const rate = Number(document.getElementById('r-rate').value)||0;
  let days = Math.round((end-start)/86400000)+1;
  if(days<1) days=1;
  document.getElementById('r-total').value = rate*days;
}
async function saveRental(){
  const carId = document.getElementById('r-car').value;
  const clientId = document.getElementById('r-client').value;
  const startDate = document.getElementById('r-start').value;
  const endDate = document.getElementById('r-end').value;
  if(!startDate||!endDate){ toast('Pick start and end dates', true); return; }
  const rental = {
    id: uid('rt'), carId, clientId, startDate, endDate,
    city: document.getElementById('r-city').value,
    dailyRate: Number(document.getElementById('r-rate').value)||0,
    deposit: Number(document.getElementById('r-deposit').value)||0,
    totalAmount: Number(document.getElementById('r-total').value)||0,
    status:'active', createdAt: new Date().toISOString()
  };
  DB.rentals.push(rental);
  const carIdx = DB.cars.findIndex(c=>c.id===carId);
  if(carIdx>-1) DB.cars[carIdx].status = 'available';
  await saveKey('rentals');
  closeModal(); toast('Rental created'); renderRentals();
}
async function completeRental(id){
  const idx = DB.rentals.findIndex(r=>r.id===id);
  if(idx<0) return;
  const r = DB.rentals[idx];
  r.status = 'completed';
  DB.transactions.push({
    id: uid('tx'), carId:r.carId, type:'income', amount:r.totalAmount,
    date: r.endDate, month: monthKey(r.endDate), note:'Rental income — auto logged'
  });
  await Promise.all([saveKey('rentals'), saveKey('transactions')]);
  toast('Rental marked complete, income logged'); renderRentals();
}

function renderCalculator(){
  document.getElementById('topbar-actions').innerHTML = '';
  document.getElementById('content').innerHTML = `
    <div class="grid2">
      <div class="card">
        <h3>Quote Builder</h3>
        <div class="field"><label>Vehicle (optional — autofills rate)</label>
          <select id="c-car" onchange="calcCarChanged()"><option value="">— Manual —</option>
            ${DB.cars.map(c=>`<option value="${c.id}" data-rate="${c.dailyRate}">${esc(c.make)} ${esc(c.model)} (${fmt(c.dailyRate)}/day)</option>`).join('')}
          </select>
        </div>
        <div class="form-grid">
          <div class="field"><label>Daily Rate (Rs)</label><input id="c-rate" type="number" value="6500" oninput="runCalc()"></div>
          <div class="field"><label>Number of Days</label><input id="c-days" type="number" value="3" oninput="runCalc()"></div>
          <div class="field"><label>Discount (%)</label><input id="c-discount" type="number" value="0" oninput="runCalc()"></div>
          <div class="field"><label>Security Deposit (Rs)</label><input id="c-deposit" type="number" value="0" oninput="runCalc()"></div>
          <div class="field"><label>Out-of-City Surcharge / day</label><input id="c-oocity" type="number" value="0" oninput="runCalc()"></div>
          <div class="field"><label>Fuel / Driver / Extra Charges</label><input id="c-extra" type="number" value="0" oninput="runCalc()"></div>
        </div>
        <div class="check-row"><input type="checkbox" id="c-isoocity" onchange="runCalc()"> This trip is out of city</div>
      </div>
      <div class="card">
        <h3>Estimate</h3>
        <div class="calc-result" id="calc-out"></div>
      </div>
    </div>
  `;
  runCalc();
}
function calcCarChanged(){
  const sel = document.getElementById('c-car');
  if(sel.value){ document.getElementById('c-rate').value = sel.options[sel.selectedIndex].dataset.rate; }
  runCalc();
}
function runCalc(){
  const rate = Number(document.getElementById('c-rate').value)||0;
  const days = Number(document.getElementById('c-days').value)||0;
  const discount = Number(document.getElementById('c-discount').value)||0;
  const deposit = Number(document.getElementById('c-deposit').value)||0;
  const oocRate = Number(document.getElementById('c-oocity').value)||0;
  const extra = Number(document.getElementById('c-extra').value)||0;
  const isOOC = document.getElementById('c-isoocity').checked;

  const base = rate*days;
  const oocTotal = isOOC ? oocRate*days : 0;
  const subtotal = base+oocTotal+extra;
  const discountAmt = subtotal*(discount/100);
  const rentTotal = subtotal-discountAmt;
  const grandTotal = rentTotal+deposit;

  document.getElementById('calc-out').innerHTML = `
    <div class="calc-row"><span>Base rent (${fmt(rate)} × ${days} days)</span><span class="mono">${fmt(base)}</span></div>
    ${isOOC?`<div class="calc-row"><span>Out-of-city surcharge (${fmt(oocRate)} × ${days})</span><span class="mono">${fmt(oocTotal)}</span></div>`:''}
    <div class="calc-row"><span>Extra charges (fuel/driver/etc.)</span><span class="mono">${fmt(extra)}</span></div>
    <div class="calc-row"><span>Discount (${discount}%)</span><span class="mono" style="color:var(--red)">− ${fmt(discountAmt)}</span></div>
    <div class="calc-row"><span>Rental subtotal</span><span class="mono">${fmt(rentTotal)}</span></div>
    <div class="calc-row"><span>Security deposit (refundable)</span><span class="mono">${fmt(deposit)}</span></div>
    <div class="calc-row total"><span>Amount to collect</span><span>${fmt(grandTotal)}</span></div>
  `;
}

function generateAgreementPDF(){
  const name = document.getElementById('a-name').value.trim();
  if(!name){ toast('Client name is required', true); return; }
  const car = DB.cars.find(c=>c.id===document.getElementById('a-car').value);
  if(!car){ toast('Add a vehicle first', true); return; }

  const data = {
    name, father: document.getElementById('a-father').value.trim(),
    cnic: document.getElementById('a-cnic').value.trim(),
    passport: document.getElementById('a-passport').value.trim(),
    phone: document.getElementById('a-phone').value.trim(),
    office: document.getElementById('a-office').value.trim(),
    address: document.getElementById('a-address').value.trim(),
    overseas: document.getElementById('a-overseas').checked,
    color: document.getElementById('a-color').value.trim(),
    engine: document.getElementById('a-engine').value.trim(),
    chassis: document.getElementById('a-chassis').value.trim(),
    kmout: document.getElementById('a-kmout').value.trim(),
    kmin: document.getElementById('a-kmin').value.trim(),
    timeout: document.getElementById('a-timeout').value,
    timein: document.getElementById('a-timein').value,
    city: document.getElementById('a-city').value,
    ratetype: document.getElementById('a-ratetype').value,
    start: document.getElementById('a-start').value,
    end: document.getElementById('a-end').value,
    rate: Number(document.getElementById('a-rate').value)||0,
    deposit: Number(document.getElementById('a-deposit').value)||0,
    received: Number(document.getElementById('a-received').value)||0,
    notinsured: document.getElementById('a-notinsured').checked,
    g1name: document.getElementById('a-g1name').value.trim(),
    g1father: document.getElementById('a-g1father').value.trim(),
    g1office: document.getElementById('a-g1office').value.trim(),
    g1nic: document.getElementById('a-g1nic').value.trim(),
    g1cell: document.getElementById('a-g1cell').value.trim(),
    g1address: document.getElementById('a-g1address').value.trim(),
    g2name: document.getElementById('a-g2name').value.trim(),
    g2father: document.getElementById('a-g2father').value.trim(),
    g2office: document.getElementById('a-g2office').value.trim(),
    g2nic: document.getElementById('a-g2nic').value.trim(),
    g2cell: document.getElementById('a-g2cell').value.trim(),
    g2address: document.getElementById('a-g2address').value.trim(),
    photo: document.getElementById('a-photo-drop').dataset.photo || ''
  };
  const days = data.ratetype==='month' ? 1 : Math.max(1, Math.round((new Date(data.end)-new Date(data.start))/86400000)+1);
  const total = data.rate*days;
  const balance = total - data.received;

  const html = buildAgreementHTML(data, car, days, total, balance);
  const w = window.open('', '_blank');
  if(!w){ toast('Popup blocked — allow popups for this site to generate the agreement', true); return; }
  w.document.open(); w.document.write(html); w.document.close();
  toast('Agreement opened in a new tab — use Print to save as PDF');
}

(async function init(){
  document.getElementById('brand-logo').src = LOGO_DATA_URI;
  document.title = 'APS Fleet CRM';
  document.getElementById('storage-mode-line').textContent =
    USE_SUPABASE ? 'APS FLEET CRM · Connected to Supabase (shared)' :

    'APS FLEET CRM · Saved to this browser only';

    await loadAll();

  if('serviceWorker' in navigator){
    try{ await navigator.serviceWorker.register('sw.js'); }

  }
})();
